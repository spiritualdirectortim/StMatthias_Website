schema_version: "1.1"
name: ux-review-of-events-page
expected_outcome: |
  review.md lists prioritized, specific findings grounded in named principles: the
  auto-rotating carousel, hidden/unlabeled navigation built from divs, missing dates,
  times and places on event cards, "Learn More" buttons that are divs with no destination
  in the label, 13px grey text failing contrast, cards hidden at opacity 0 until a timer,
  heading order (h3 before h1, h1 styled smaller than h3), missing alt text, float layout
  that breaks on phones, and no reduced-motion handling. Each finding says why it matters
  and what to do instead. The file does not rewrite the page.
context:
  scaffold_script: place-files.sh
